services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FORECAST_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
